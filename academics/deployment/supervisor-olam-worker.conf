# Supervisor configuration for OLAM Queue Workers
# Save this file to: /etc/supervisor/conf.d/olam-worker.conf
# Then run:
#   sudo supervisorctl reread
#   sudo supervisorctl update
#   sudo supervisorctl start olam-worker:*

[program:olam-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/olam_portal/artisan queue:work database --sleep=3 --tries=3 --max-time=3600 --timeout=60
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=4
redirect_stderr=true
stdout_logfile=/var/www/olam_portal/storage/logs/worker.log
stopwaitsecs=3600

# For notification processing worker
[program:olam-notification-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/olam_portal/artisan queue:work database --queue=notifications --sleep=5 --tries=3 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/olam_portal/storage/logs/notification-worker.log
stopwaitsecs=3600

# For email processing worker
[program:olam-email-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/olam_portal/artisan queue:work database --queue=emails --sleep=5 --tries=3 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/olam_portal/storage/logs/email-worker.log
stopwaitsecs=3600
